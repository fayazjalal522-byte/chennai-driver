<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DriveEase Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1 data-i18n="admin_dashboard">📊 DriveEase Admin</h1>
  <p class="sub" data-i18n="admin_subtitle">All bookings & revenue</p>

  <a href="analytics.html" style="text-decoration:none;"><button class="btn-blue" style="margin-bottom:8px;">📈 View Analytics</button></a>
  <a href="leaderboard.html" style="text-decoration:none;"><button class="btn-blue" style="margin-bottom:8px;" data-i18n="view_leaderboard">🏆 View Leaderboard</button></a>
  <a href="driver-onboard.html" style="text-decoration:none;"><button class="btn-blue" style="margin-bottom:8px;">📝 Driver Registration Page</button></a>

  <div class="stats-grid" id="statsGrid"></div>
  <button onclick="loadAdmin()" data-i18n="refresh">🔄 Refresh</button>

  <h3>⚠️ Complaints</h3>
  <div id="complaintsList">Loading...</div>

  <h3>🚗 Pending Driver Applications</h3>
  <div id="driverApps"></div>

  <h3 style="margin-top:20px;">✅ Approved Drivers</h3>
  <div id="approvedDrivers"></div>

  <h3 data-i18n="all_bookings" style="margin-top:20px;">All Bookings</h3>
  <div id="adminList"></div>
</div>

<script src="i18n.js?v=13"></script>
<script src="app.js?v=13"></script>
<script>
async function loadAdmin() {
  document.getElementById('adminList').innerHTML = `<div class="spinner">${t('loading')}</div>`;
  const res = await getStats();
  const bookings = await listBookings();
  if (res.ok) {
    const s = res.stats;
    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card"><div class="num" style="color:#f59e0b;">${s.pending}</div><div class="lbl">${t('pending')}</div></div>
      <div class="stat-card"><div class="num" style="color:#3b82f6;">${s.accepted}</div><div class="lbl">${t('active')}</div></div>
      <div class="stat-card"><div class="num" style="color:#22c55e;">${s.completed}</div><div class="lbl">${t('completed')}</div></div>
      <div class="stat-card"><div class="num" style="color:#ff6b35;">₹${s.revenue}</div><div class="lbl">${t('revenue')}</div></div>`;
  }

  document.getElementById('adminList').innerHTML = bookings.reverse().map(b => {
    let rideInfo = '';
    if (b.status === 'AWAITING_OTP' || b.status === 'IN_PROGRESS') {
      rideInfo = `<div style="margin-top:6px;padding:6px;background:#fff8f3;border-radius:6px;font-size:12px;">
        ${b.otp ? `🔐 OTP: <strong>${b.otp}</strong> | ` : ''}
        ${b.startTime ? `Started: ${new Date(b.startTime).toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'})}` : ''}
      </div>`;
    } else if (b.status === 'COMPLETED' && b.durationMins) {
      rideInfo = `<div style="margin-top:6px;padding:6px;background:#f0fdf4;border-radius:6px;font-size:12px;">
        ⏱️ Duration: <strong>${formatDuration(b.durationMins)}</strong>
        ${Number(b.extraCharge) > 0 ? ` | Extra: ₹${b.extraCharge}` : ''}
      </div>`;
    }
    return `
    <div class="card ${b.status.toLowerCase()}">
      <span class="badge ${b.status.toLowerCase()}">${t(b.status.toLowerCase()) || b.status}</span>
      <strong style="margin-left:6px;">${b.id}</strong>
      <div style="margin-top:8px;">
        ${b.name} • <a href="tel:${b.phone}">${b.phone}</a><br>
        ${b.pickup} → ${b.drop}<br>
        ${new Date(b.datetime).toLocaleString('en-IN')} • ₹${b.fare}<br>
        ${t('driver_label')}: ${b.driver || '—'}${b.rating ? ` • ⭐ ${b.rating}` : ''}
      </div>
      ${rideInfo}
    </div>`;
  }).join('') || `<p style="text-align:center;color:#999;">${t('no_bookings')}</p>`;

  loadDriverApps();
  loadComplaints();
}

async function loadDriverApps() {
  const res = await apiCall({ action: 'driverList' });
  if (!res.ok) return;

  const pending = res.drivers.filter(d => d.status === 'PENDING');
  const approved = res.drivers.filter(d => d.status === 'APPROVED');

  document.getElementById('driverApps').innerHTML =
    (pending.length === 0 ? '<p style="color:#999;">No pending applications.</p>' :
    pending.map(d => `
      <div class="card pending">
        <span class="badge pending">PENDING</span>
        <div style="margin-top:8px;">
          <strong>${d.name}</strong> — <a href="tel:${d.phone}">${d.phone}</a><br>
          License No: <strong>${d.licenseNo || '—'}</strong><br>
          Aadhaar Last 4: <strong>${d.aadhaarLast4 || '—'}</strong><br>
          Vehicle: ${d.vehicle} • Experience: ${d.experience}<br>
          Area: ${d.area}
        </div>
        <div style="margin-top:10px;padding-top:10px;border-top:1px dashed #ddd;">
          <strong>📎 Documents:</strong><br>
          ${d.licenseUrl ? `📷 <a href="${d.licenseUrl}" target="_blank">View License</a><br>` : '<span style="color:#ef4444;">❌ License missing</span><br>'}
          ${d.aadhaarUrl ? `🆔 <a href="${d.aadhaarUrl}" target="_blank">View Aadhaar Front</a><br>` : '<span style="color:#ef4444;">❌ Aadhaar Front missing</span><br>'}
          ${d.aadhaarBackUrl ? `🆔 <a href="${d.aadhaarBackUrl}" target="_blank">View Aadhaar Back</a><br>` : '<span style="color:#ef4444;">❌ Aadhaar Back missing</span><br>'}
          ${d.selfieUrl ? `🤳 <a href="${d.selfieUrl}" target="_blank">View Selfie</a><br>` : '<span style="color:#999;">🤳 Selfie not uploaded</span><br>'}
          ${d.policeUrl ? `🛡️ <a href="${d.policeUrl}" target="_blank">View Police Certificate</a><br>` : '<span style="color:#999;">🛡️ Police cert not provided</span><br>'}
          ${d.folderUrl ? `<br>📁 <a href="${d.folderUrl}" target="_blank">Open Full Folder in Drive</a>` : ''}
        </div>
        <div class="row">
          <button class="btn-green" onclick="approveDriver('${d.id}')">✅ Approve</button>
          <button class="btn-red" onclick="rejectDriver('${d.id}')">❌ Reject</button>
        </div>
      </div>`).join('')) || '<p style="color:#999;">—</p>';

  document.getElementById('approvedDrivers').innerHTML =
    (approved.length === 0 ? '<p style="color:#999;">No approved drivers yet.</p>' :
    approved.map(d => `
      <div class="card completed" style="${d.blacklisted === 'Yes' ? 'border-left-color:#ef4444;background:#fef2f2;' : ''}">
        <span class="badge completed">APPROVED</span>
        ${d.blacklisted === 'Yes' ? '<span class="badge" style="background:#fee2e2;color:#991b1b;margin-left:6px;">🚫 BLACKLISTED</span>' : ''}
        <div style="margin-top:8px;">
          <strong>${d.name}</strong> — ${d.phone}<br>
          Driver ID: <strong>${d.id}</strong><br>
          Area: ${d.area}
          ${d.policeUrl ? ' • 🛡️ Police Verified' : ''}
        </div>
        ${d.folderUrl ? `<div style="margin-top:6px;font-size:12px;">📁 <a href="${d.folderUrl}" target="_blank">View Documents</a></div>` : ''}
        <div class="row" style="margin-top:8px;">
          <button class="btn-blue" onclick="resetPinHandler('${d.id}')" style="font-size:12px;padding:6px;">🔐 Reset PIN</button>
          ${d.blacklisted === 'Yes' 
            ? `<button class="btn-green" onclick="blacklistHandler('${d.id}', false)" style="font-size:12px;padding:6px;">✅ Un-blacklist</button>` 
            : `<button class="btn-red" onclick="blacklistHandler('${d.id}', true)" style="font-size:12px;padding:6px;">🚫 Blacklist</button>`}
        </div>
      </div>`).join(''));
}

async function loadComplaints() {
  const complaints = await getComplaintList();
  const container = document.getElementById('complaintsList');
  if (!complaints || complaints.length === 0) {
    container.innerHTML = '<p style="color:#999;">No complaints yet.</p>';
    return;
  }
  container.innerHTML = complaints.reverse().map(c => `
    <div class="card ${c.status === 'RESOLVED' ? 'completed' : 'pending'}">
      <span class="badge ${c.status === 'RESOLVED' ? 'completed' : 'pending'}">${c.status}</span>
      <strong style="margin-left:6px;">${c.id}</strong>
      <div style="margin-top:8px;font-size:13px;">
        ${c.customerName || 'Anonymous'} ${c.customerPhone ? `• <a href="tel:${c.customerPhone}">${c.customerPhone}</a>` : ''}<br>
        <strong>Reason:</strong> ${c.reason}<br>
        ${c.details ? `<strong>Details:</strong> ${c.details}<br>` : ''}
        ${c.bookingId ? `<strong>Booking:</strong> ${c.bookingId}<br>` : ''}
        <em style="color:#999;font-size:11px;">${new Date(c.timestamp).toLocaleString('en-IN')}</em>
      </div>
      ${c.status === 'OPEN' ? `
        <div class="row" style="margin-top:8px;">
          <button class="btn-green" onclick="resolveComplaintHandler('${c.id}')" style="font-size:12px;padding:6px;">✅ Mark Resolved</button>
        </div>` : ''}
    </div>
  `).join('');
}

async function approveDriver(id) {
  if (!confirm('Approve this driver?')) return;
  await apiCall({ action: 'driverApprove', driverId: id, status: 'APPROVED', approvedBy: 'Admin' });
  showToast('✅ Driver approved');
  loadDriverApps();
}

async function rejectDriver(id) {
  if (!confirm('Reject this driver?')) return;
  await apiCall({ action: 'driverApprove', driverId: id, status: 'REJECTED', approvedBy: 'Admin' });
  showToast('Driver rejected');
  loadDriverApps();
}

async function resetPinHandler(driverId) {
  if (!confirm('Reset PIN for this driver? They will get temporary PIN 0000.')) return;
  const res = await resetPin(driverId);
  if (res.ok) {
    showToast('✅ PIN reset to 0000. Tell driver to login with 0000.');
  } else {
    showToast('Failed to reset');
  }
}

async function blacklistHandler(driverId, shouldBlacklist) {
  const action = shouldBlacklist ? 'blacklist' : 'un-blacklist';
  if (!confirm(`Are you sure you want to ${action} this driver?`)) return;
  const res = await blacklistDriver(driverId, shouldBlacklist);
  if (res.ok) {
    showToast(`✅ Driver ${action}ed`);
    loadDriverApps();
  } else {
    showToast('Failed');
  }
}

async function resolveComplaintHandler(complaintId) {
  if (!confirm('Mark this complaint as resolved?')) return;
  const res = await resolveComplaint(complaintId, 'RESOLVED');
  if (res.ok) {
    showToast('✅ Marked resolved');
    loadComplaints();
  }
}

loadAdmin();
setInterval(loadAdmin, 60000);
</script>
</body>
</html>
